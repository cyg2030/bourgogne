// ── CARTE ──
const map = L.map('map').setView([47.0, 4.85], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

// ── COUCHES ──
const layers = { regions: L.layerGroup(), vignobles: L.layerGroup(), restaurants: L.layerGroup(), maison: L.layerGroup(), visites: L.layerGroup() };
const layerState = { regions:false, vignobles:false, restaurants:false, maison:false, visites:false };
const DEFAULT_ON = ['regions','vignobles','maison'];

const byRegion = {};
COMMUNES_DATA.features.forEach(f => (byRegion[f.properties.region] = byRegion[f.properties.region] || []).push(f));
Object.keys(byRegion).forEach(region => {
  const color = REGION_COLORS[region] || '#999';
  // interactive:false : contours purement décoratifs (ni clic, ni cadre de focus)
  L.geoJSON({ type:'FeatureCollection', features:byRegion[region] }, {
    interactive:false,
    style:{ color, weight:0.6, opacity:0.45, fillColor:color, fillOpacity:0.28 }
  }).addTo(layers.regions);
});

function pinIcon(c, home, ordre){
  const s = home ? 34 : 30;
  return L.divIcon({
    className:'',
    html:`<div class="pin ${home?'home':''}" style="width:${s}px;height:${s}px;background:${c.color}">${c.emoji}${ordre ? `<span class="ordre">${ordre}</span>` : ''}</div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2]
  });
}
const bounds = [];
const nbEtapes = LIEUX.filter(l => l.ordre).length;
LIEUX.forEach(l => {
  const c = CATS[l.cat];
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.cat === 'maison' ? l.addr : l.name + ', ' + l.addr);
  L.marker(l.ll, { icon:pinIcon(c, l.cat==='maison', l.ordre), zIndexOffset:1000, title:l.name })
    .bindPopup(() => lieuPhotos(l) + `<span class="popup-kind" style="background:${c.color}">${c.emoji} ${c.label}</span>
      <div class="popup-title">${l.name}</div>
      <div class="popup-addr">${l.addr}</div>
      ${l.ordre ? `<div class="popup-rdv"><b>Étape ${l.ordre} sur ${nbEtapes}</b><br>${l.jour} · ${l.heure}</div>` : ''}
      <div class="liens">${lienGM(gmaps)}${LIEU_PHOTOS[l.name] ? lienIM() : ""}</div>`, { minWidth:230 })
    .addTo(layers[l.cat]);
  bounds.push(l.ll);
});
map.fitBounds(bounds, { padding:[50,50] });
// recalcule la taille et recadre une fois la mise en page stabilisée (barres du navigateur mobile, rotation)
function refit(){ map.invalidateSize(); map.fitBounds(bounds, { padding:[50,50] }); }
window.addEventListener('load', refit);
window.addEventListener('orientationchange', () => setTimeout(refit, 300));
window.addEventListener('resize', () => map.invalidateSize());

function lieuPhotos(l){
  const ph = LIEU_PHOTOS[l.name]; if (!ph) return '';
  const k = 'l' + LIEUX.indexOf(l); PHOTO_SETS[k] = { photos:ph, idx:0 };
  const n = ph.length;
  const nav = n > 1 ? `<button class="photo-nav prev" onclick="navPhoto('${k}',-1)">‹</button><button class="photo-nav next" onclick="navPhoto('${k}',1)">›</button>` : '';
  return `<div class="photo-wrap"><img id="img-${k}" src="${thumbUrl(ph[0][0])}" onerror="this.parentElement.style.display='none'"><div class="photo-badge" id="badge-${k}">${ph[0][1]}${n > 1 ? ` · 1/${n}` : ''}</div>${nav}</div>`;
}
STOPS.forEach((s, i) => {
  const k = 's' + i, ci = dayIdx(s.date), col = DAY_COLORS[ci % DAY_COLORS.length], sz = s.major ? 22 : 14;
  PHOTO_SETS[k] = { photos:s.photos, idx:0 };
  const icon = L.divIcon({ className:'', iconSize:[sz, sz], iconAnchor:[sz/2, sz/2], popupAnchor:[0, -sz/2],
    html:s.major ? `<div class="pin-photo" style="width:22px;height:22px;border:3px solid ${col}">📸</div>` : `<div class="pin-photo" style="width:14px;height:14px;border:2px solid ${col}"></div>` });
  L.marker([s.lat, s.lon], { icon, title:s.name }).bindPopup(() => {
    const ps = PHOTO_SETS[k]; ps.idx = 0; const n = ps.photos.length;
    const nav = n > 1 ? `<button class="photo-nav prev" onclick="navPhoto('${k}',-1)">‹</button><button class="photo-nav next" onclick="navPhoto('${k}',1)">›</button>` : '';
    return `<div class="photo-wrap"><img id="img-${k}" src="${thumbUrl(ps.photos[0][0])}" onerror="this.parentElement.style.display='none'"><div class="photo-badge" id="badge-${k}">${ps.photos[0][1]}${n > 1 ? ` · 1/${n}` : ''}</div>${nav}</div>
      <span class="popup-kind" style="background:${col}">${dayLabel(s.date)}</span>
      <div class="popup-title">${s.name}</div>
      <div class="popup-addr">${s.range} · ${n} photo${n > 1 ? 's' : ''}</div>
      <div class="liens">${lienGM(`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`)}${lienIM()}</div>`;
  }, { minWidth:230 }).addTo(TL[ci][s.major ? 'photos' : 'petits']);
});
function refreshTrace(){
  TL.forEach((g, i) => ['trace','photos','petits'].forEach(t => {
    const on = dayOn[i] && (t === 'trace' || typeOn[t]);
    if (on) g[t].addTo(map); else map.removeLayer(g[t]);
  }));
  TRACE.forEach((d, i) => syncSubBtn('btn-jour' + i, dayOn[i]));
  ['photos','petits'].forEach(t => syncSubBtn('btn-t-' + t, typeOn[t]));
}
function toggleDay(i){ dayOn[i] = !dayOn[i]; refreshTrace(); }
function toggleType(t){ typeOn[t] = !typeOn[t]; refreshTrace(); }
function soloDay(i){ dayOn.fill(false); dayOn[i] = true; refreshTrace(); }
document.getElementById('menu-jours').innerHTML = TRACE.map((d, i) =>
  `<button class="sub-btn active" id="btn-jour${i}" onclick="toggleDay(${i})"><span class="icon"><span class="dot" style="background:${DAY_COLORS[i % DAY_COLORS.length]}">${i + 1}</span></span><span class="label">J${i + 1} — ${d.label}</span><span class="check"></span></button>`).join('');
refreshTrace();

// ── UI ──
function syncSubBtn(id, on){ document.getElementById(id).classList.toggle('active', on); }
function toggleLayer(name, force){
  const on = force === undefined ? !layerState[name] : force;
  layerState[name] = on;
  if (on) layers[name].addTo(map); else map.removeLayer(layers[name]);
  syncSubBtn('btn-' + name, on);
}
function toggleGroup(name){
  document.querySelectorAll('.grp-menu').forEach(m => { if (m.id !== 'grpmenu-' + name) m.classList.remove('open'); });
  document.querySelectorAll('.grp-btn').forEach(b => { if (b.id !== 'grpbtn-' + name) b.classList.remove('open'); });
  const open = document.getElementById('grpmenu-' + name).classList.toggle('open');
  document.getElementById('grpbtn-' + name).classList.toggle('open', open);
}
Object.keys(layers).forEach(n => toggleLayer(n, DEFAULT_ON.includes(n)));
if (window.innerWidth > 700) toggleGroup('filtres');  // menu ouvert d'emblée sur grand écran seulement
</script>
